name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: backend (java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test
        run: mvn -B -f pom.xml test

  frontend:
    name: frontend (node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apache-2.0 headers and author
        run: |
          set -e
          missing=0
          while IFS= read -r f; do
            if ! grep -q "Licensed under the Apache License, Version 2.0" "$f" || ! grep -q "@author suhong" "$f"; then
              echo "missing header: $f"
              missing=1
            fi
          done < <(git ls-files '*.java' '*.ts' '*.tsx' '*.css' '*.sql' '*.sh' '*.ps1' '*.yml' '*.yaml' | grep -v '^\\.github/')
          exit $missing

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
