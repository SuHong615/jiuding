name: Feature request
description: 提出新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而非直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options: [多租户, 审批, Agent/Skill, MCP, 身份/RBAC, 前端, CLI, 部署, 文档, 其他]
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我可以提交 PR
        - label: 我可以提供测试/复现环境
