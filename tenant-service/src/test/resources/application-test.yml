spring:
  datasource:
    url: jdbc:h2:mem:tenant_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

tenancy:
  security:
    api-keys: dev-mcp-key
    internal-token: dev-internal-token
  # PostgreSQL RLS is disabled on H2 (docs/23 section 2); the wrapper is not installed.
  rls:
    enabled: false
  # Tests use the in-memory permission cache; Redis is exercised with stubs only.
  redis:
    enabled: false
  # Deterministically unreachable agent tier: risk review / rating skill degrade to local rules.
  agent-service:
    url: http://127.0.0.1:1
    connect-timeout-ms: 200
    read-timeout-ms: 500
    api-key: dev-mcp-key
  rating:
    enabled: true
    timeout-ms: 500
    # Scheduler is exercised directly through RatingRefreshService.refreshActive in tests.
    auto-refresh-enabled: false
  approval-service:
    # Deliberately unreachable so the submit degradation path is deterministic.
    url: http://127.0.0.1:1
    connect-timeout-ms: 300
    read-timeout-ms: 500
  collect:
    sync: true
    max-errors: 20

logging:
  level:
    com.suhong.jiuding.tenant: INFO
    org.springframework.web: WARN
