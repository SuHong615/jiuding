# @author suhong
server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:h2:file:./data/agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      pool-name: agent-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

tenancy:
  security:
    jwt-secret: ${TENANCY_JWT_SECRET:tenancy-center-dev-secret-change-me-please}
    token-ttl-minutes: ${TENANCY_TOKEN_TTL_MINUTES:120}
    api-keys: ${TENANCY_SECURITY_API_KEYS:dev-mcp-key}
  skills-dir: ${TENANCY_SKILLS_DIR:../skills}
  internal-token: ${TENANCY_INTERNAL_TOKEN:dev-internal-token}
  services:
    tenant-url: ${TENANT_SERVICE_URL:http://localhost:8081}
    approval-url: ${APPROVAL_SERVICE_URL:http://localhost:8082}
  agent:
    max-steps: ${TENANCY_AGENT_MAX_STEPS:6}
    timeout-seconds: ${TENANCY_AGENT_TIMEOUT_SECONDS:60}
    model:
      provider: ${TENANCY_AGENT_MODEL_PROVIDER:scripted}
      name: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      temperature: ${OPENAI_TEMPERATURE:0.0}
      max-tokens: ${OPENAI_MAX_TOKENS:1024}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}

logging:
  level:
    com.suhong.jiuding.agent: INFO
    io.agentscope: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://postgres:5432/agent_db}
    username: ${AGENT_DB_USER:tenancy}
    password: ${AGENT_DB_PASSWORD:tenancy}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

tenancy:
  skills-dir: ${TENANCY_SKILLS_DIR:/app/skills}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agent_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
