# @author suhong
# Local override for this development box (Docker Engine inside WSL2).
#
# Why this file exists:
#   * port 8080 is already published by the opencode gateway container, so the
#     tenancy gateway is published on 18080 here (the frontend nginx still talks
#     to gateway:8080 inside the compose network);
#   * the box has a single 7.8 GB WSL VM shared with dockerd and other containers,
#     so JVM heaps / postgres buffers are kept small for a 5-service stack.
#
# Usage (from deploy/):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   curl http://localhost:18080/actuator/health
#   curl http://localhost:8088/
version: "3.9"

services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]

  tenant-service:
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m"
    ports: !override
      - "8081:8081"

  approval-service:
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m"
    ports: !override
      - "8082:8082"

  agent-service:
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m"
    ports: !override
      - "8083:8083"

  mcp-service:
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m"
    ports: !override
      - "8084:8084"

  gateway:
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m"
    ports: !override
      - "18080:8080"

  frontend:
    ports: !override
      - "8088:80"
