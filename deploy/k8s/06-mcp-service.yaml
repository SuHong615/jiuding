# @author suhong
# mcp-service (8084) - MCP JSON-RPC server (14 tools / 4 resources / 2 prompts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-service
  namespace: tenancy-center
  labels: { app: mcp-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-service }
  template:
    metadata:
      labels: { app: mcp-service }
    spec:
      containers:
        - name: mcp-service
          image: tenancy/mcp-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TENANT_SERVICE_URL
              value: http://tenant-service:8081
            - name: APPROVAL_SERVICE_URL
              value: http://approval-service:8082
            - name: AGENT_SERVICE_URL
              value: http://agent-service:8083
            # v5: per-user MCP API keys / call audits / external servers live in mcp_db.
            - name: MCP_DB_URL
              value: jdbc:postgresql://postgres:5432/mcp_db
            - name: MCP_DB_USER
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: MCP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: MCP_DB_PASSWORD } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mcp_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: MCP_DB_PASSWORD } }
            - name: TENANCY_SECURITY_API_KEYS
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_API_KEYS } }
            - name: TENANCY_SECURITY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_JWT_SECRET } }
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8084
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: tenancy-center
spec:
  type: NodePort
  selector: { app: mcp-service }
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
