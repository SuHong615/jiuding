# @author suhong
# PostgreSQL 16 with the three per-service databases (tenant_db / approval_db / agent_db).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tenancy-center
data:
  01-databases.sql: |
    CREATE DATABASE tenant_db;
    CREATE DATABASE approval_db;
    CREATE DATABASE agent_db;
    CREATE DATABASE mcp_db;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: tenancy-center
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tenancy-center
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - shared_buffers=256MB
            - -c
            - max_connections=300
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "tenancy", "-d", "postgres"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "tenancy", "-d", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tenancy-center
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
