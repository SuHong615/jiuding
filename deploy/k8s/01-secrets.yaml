# @author suhong
# Shared secret material for the local k3s deployment.
# Values mirror deploy/.env.example; rotate for anything beyond local verification.
#
# WARNING: DEMO VALUES ONLY. Never use these secrets on a public network or in
# production. Generate strong values and provide them via your secret manager
# (or replace this file before deployment). See SECURITY.md.
#
apiVersion: v1
kind: Secret
metadata:
  name: tenancy-secrets
  namespace: tenancy-center
type: Opaque
stringData:
  POSTGRES_USER: tenancy
  POSTGRES_PASSWORD: tenancy-dev-pass
  # mcp-service v5 owns mcp_db; keep a distinct password variable for rotation.
  MCP_DB_PASSWORD: tenancy-dev-pass
  TENANCY_SECURITY_JWT_SECRET: tenancy-center-dev-secret-change-me-please
  TENANCY_INTERNAL_TOKEN: dev-internal-token
  TENANCY_SECURITY_API_KEYS: dev-mcp-key
