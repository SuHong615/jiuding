# TEMPLATE ONLY — never apply this file directly to a shared cluster.
# `deploy.sh` / `prod/apply-prod.sh` call gen-secrets.sh, which creates the
# `tenancy-secrets` Secret with random values when it does not exist yet.
# The CHANGE_ME placeholders below are intentionally non-functional.
apiVersion: v1
kind: Secret
metadata:
  name: tenancy-secrets
  namespace: tenancy-center
type: Opaque
stringData:
  POSTGRES_USER: tenancy
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
  # mcp-service v5 owns mcp_db; keep a distinct password variable for rotation.
  MCP_DB_PASSWORD: CHANGE_ME_MCP_DB_PASSWORD
  TENANCY_SECURITY_JWT_SECRET: CHANGE_ME_JWT_SECRET
  TENANCY_INTERNAL_TOKEN: CHANGE_ME_INTERNAL_TOKEN
  TENANCY_SECURITY_API_KEYS: CHANGE_ME_MCP_API_KEY
