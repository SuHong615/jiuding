# @author suhong
# tenant-service (8081) - tenant lifecycle + collection (+ skill-driven risk review).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: tenancy-center
  labels: { app: tenant-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tenant-service }
  template:
    metadata:
      labels: { app: tenant-service }
    spec:
      containers:
        - name: tenant-service
          image: tenancy/tenant-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: TENANCY_REDIS_ENABLED
              value: "true"
            - name: TENANT_DB_URL
              value: jdbc:postgresql://postgres:5432/tenant_db
            - name: TENANT_DB_USER
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: TENANT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_PASSWORD } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/tenant_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_PASSWORD } }
            - name: APPROVAL_SERVICE_URL
              value: http://approval-service:8082
            - name: AGENT_SERVICE_URL
              value: http://agent-service:8083
            - name: TENANCY_SECURITY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_JWT_SECRET } }
            - name: TENANCY_SECURITY_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_INTERNAL_TOKEN } }
            - name: TENANCY_SECURITY_API_KEYS
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_API_KEYS } }
            - name: TENANCY_PLATFORM_BOOTSTRAP_USERNAME
              value: admin
            - name: TENANCY_PLATFORM_BOOTSTRAP_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_BOOTSTRAP_ADMIN_PASSWORD } }
            - name: TENANCY_PLATFORM_BOOTSTRAP_ROLES
              value: PLATFORM_ADMIN
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { cpu: "1", memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: tenancy-center
spec:
  type: NodePort
  selector: { app: tenant-service }
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
