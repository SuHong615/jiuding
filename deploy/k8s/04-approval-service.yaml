# @author suhong
# approval-service (8082) - approval workflow, automation policy and provisioning orchestration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-service
  namespace: tenancy-center
  labels: { app: approval-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: approval-service }
  template:
    metadata:
      labels: { app: approval-service }
    spec:
      containers:
        - name: approval-service
          image: tenancy/approval-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: APPROVAL_DB_URL
              value: jdbc:postgresql://postgres:5432/approval_db
            - name: APPROVAL_DB_USER
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: APPROVAL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_PASSWORD } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/approval_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: POSTGRES_PASSWORD } }
            - name: TENANT_SERVICE_URL
              value: http://tenant-service:8081
            - name: AGENT_SERVICE_URL
              value: http://agent-service:8083
            - name: TENANCY_SECURITY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_JWT_SECRET } }
            - name: TENANCY_SECURITY_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_INTERNAL_TOKEN } }
            - name: TENANCY_SECURITY_API_KEYS
              valueFrom: { secretKeyRef: { name: tenancy-secrets, key: TENANCY_SECURITY_API_KEYS } }
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { cpu: "1", memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: approval-service
  namespace: tenancy-center
spec:
  type: NodePort
  selector: { app: approval-service }
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
