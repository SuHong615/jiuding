skillId: tenant-intake
version: 1.0.0
initialScore: 0
rules:
  - id: R-INTAKE-001
    description: 缺少必填字段 tenantCode 或 name
    severity: HIGH
    when:
      any:
        - { field: tenantCode, op: empty }
        - { field: name, op: empty }
    then:
      - { action: addScore, value: 40 }
      - { action: addFinding, message: 缺少必填字段 tenantCode 或 name, severity: HIGH }
  - id: R-INTAKE-002
    description: 未提供联系人邮箱
    severity: LOW
    when: { field: contactEmail, op: empty }
    then:
      - { action: addScore, value: 10 }
      - { action: addFinding, message: 未提供联系邮箱，后续通知可能失败, severity: LOW }
  - id: R-INTAKE-003
    description: 邮箱格式不合法
    severity: MEDIUM
    when:
      all:
        - { field: contactEmail, op: exists }
        - not: { field: contactEmail, op: matches, value: "^[^@\\s]+@[^@\\s]+\\.[A-Za-z]{2,}$" }
    then:
      - { action: addScore, value: 30 }
      - { action: addFinding, message: 邮箱格式不合法, severity: MEDIUM }
  - id: R-INTAKE-004
    description: plan 使用别名，需要归一化
    severity: LOW
    when:
      all:
        - { field: plan, op: exists }
        - { field: plan, op: notIn, value: [FREE, PRO, ENTERPRISE] }
    then:
      - { action: addScore, value: 5 }
      - { action: addTag, value: plan-alias }
      - { action: addFinding, message: plan 使用别名，已按规范归一化, severity: LOW }
  - id: R-INTAKE-005
    description: region 使用别名，需要归一化
    severity: LOW
    when:
      all:
        - { field: region, op: exists }
        - { field: region, op: in, value: [shanghai, beijing, shenzhen, guangzhou, singapore, 上海, 北京, 深圳, 广州, 新加坡] }
    then:
      - { action: addScore, value: 5 }
      - { action: addTag, value: region-alias }
      - { action: addFinding, message: region 使用别名，已归一化为标准区域码, severity: LOW }
  - id: R-INTAKE-006
    description: 采集端标记疑似重复租户
    severity: MEDIUM
    when: { field: duplicateCandidate, op: eq, value: true }
    then:
      - { action: addScore, value: 25 }
      - { action: addFinding, message: 疑似重复租户，需要人工确认租户编码唯一性, severity: MEDIUM }
  - id: R-INTAKE-007
    description: 租户编码符合规范
    severity: LOW
    when:
      all:
        - { field: tenantCode, op: exists }
        - { field: tenantCode, op: matches, value: "^[a-z][a-z0-9-]{2,31}$" }
    then:
      - { action: addScore, value: -5 }
decision:
  autoApproveMaxScore: 10
  rejectMinScore: 80
  riskLevels:
    - { level: LOW, maxScore: 10 }
    - { level: MEDIUM, maxScore: 40 }
    - { level: HIGH, maxScore: 100 }
