skillId: approval-policy
version: 1.0.0
initialScore: 0
rules:
  - id: R-APR-001
    description: 低风险且非 ENTERPRISE 自动通过
    severity: LOW
    when:
      all:
        - { field: riskLevel, op: eq, value: LOW }
        - { field: plan, op: notIn, value: [ENTERPRISE] }
    then:
      - { action: setDecision, value: AUTO_APPROVE }
      - { action: requireRole, value: SYSTEM }
      - { action: setSlaHours, value: 4 }
      - { action: addTag, value: auto-approve }
  - id: R-APR-002
    description: ENTERPRISE 租户至少 L2 审批（先于风险等级规则，可被更具体规则覆盖）
    severity: MEDIUM
    when: { field: plan, op: eq, value: ENTERPRISE }
    then:
      - { action: addScore, value: 15 }
      - { action: requireRole, value: L2 }
      - { action: setSlaHours, value: 12 }
      - { action: addTag, value: enterprise }
  - id: R-APR-003
    description: 中风险走 L1 人工审批
    severity: MEDIUM
    when: { field: riskLevel, op: eq, value: MEDIUM }
    then:
      - { action: addScore, value: 20 }
      - { action: setDecision, value: NEEDS_REVIEW }
      - { action: requireRole, value: L1 }
      - { action: setSlaHours, value: 24 }
  - id: R-APR-004
    description: 高风险走 L2 人工会签
    severity: HIGH
    when: { field: riskLevel, op: eq, value: HIGH }
    then:
      - { action: addScore, value: 60 }
      - { action: setDecision, value: NEEDS_REVIEW }
      - { action: requireRole, value: L2 }
      - { action: setSlaHours, value: 8 }
      - { action: addFinding, message: 高风险租户需要 L2 会签, severity: HIGH }
  - id: R-APR-005
    description: LOW + ENTERPRISE 不能自动通过
    severity: MEDIUM
    when:
      all:
        - { field: riskLevel, op: eq, value: LOW }
        - { field: plan, op: eq, value: ENTERPRISE }
    then:
      - { action: addScore, value: 30 }
      - { action: setDecision, value: NEEDS_REVIEW }
      - { action: requireRole, value: L2 }
      - { action: setSlaHours, value: 12 }
      - { action: addFinding, message: ENTERPRISE 租户即使低风险也必须人工审批, severity: MEDIUM }
  - id: R-APR-006
    description: 风险分过高直接驳回
    severity: HIGH
    when: { field: riskScore, op: gte, value: 80 }
    then:
      - { action: addScore, value: 40 }
      - { action: setDecision, value: REJECT }
      - { action: addFinding, message: riskScore >= 80，自动驳回, severity: HIGH }
  - id: R-APR-007
    description: 风险原因包含黑名单命中直接驳回
    severity: HIGH
    when: { field: reasons, op: contains, value: blacklist }
    then:
      - { action: setDecision, value: REJECT }
      - { action: addFinding, message: 风险原因包含黑名单命中，自动驳回, severity: HIGH }
decision:
  emit: false
